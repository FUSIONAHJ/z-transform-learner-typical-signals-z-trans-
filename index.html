<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Z-Transform Interactive Learner (Offline)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .math-font { font-family: 'Times New Roman', Times, serif; font-style: italic; }
      #error-overlay { display: none; padding: 20px; background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; margin: 20px; border-radius: 8px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai",
        "react-markdown": "https://esm.sh/react-markdown@9.0.1",
        "recharts": "https://esm.sh/recharts@2.12.3?external=react,react-dom",
        "d3": "https://esm.sh/d3@7.9.0"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="error-overlay"></div>
    <div id="root"></div>
    
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML = '<strong>Runtime Error:</strong> ' + message + '<br><small>' + source + ':' + lineno + '</small>';
      };
    </script>

    <script type="text/babel" data-type="module" data-presets="react">

import React, { useState, useMemo, useEffect, useRef, useCallback } from 'react';
import ReactDOM from 'react-dom/client';
import * as d3 from 'd3';
import { ResponsiveContainer, ComposedChart, XAxis, YAxis, Tooltip, CartesianGrid, Scatter, Bar, Cell } from 'recharts';
import ReactMarkdown from 'react-markdown';
import { GoogleGenAI } from '@google/genai';


// TYPES

const SignalType = {
  IMPULSE: 'IMPULSE',
  STEP: 'STEP',
  RAMP: 'RAMP',
  EXPONENTIAL: 'EXPONENTIAL',
  DOUBLE_EXPONENTIAL: 'DOUBLE_EXPONENTIAL',
  SINUSOIDAL: 'SINUSOIDAL',
  POLE_ZERO: 'POLE_ZERO'
};


// CONSTANTS

const SIGNALS = {
  [SignalType.IMPULSE]: {
    id: SignalType.IMPULSE,
    name: 'Unit Impulse (δ[n])',
    description: 'The fundamental building block. Non-zero only at n=0.',
    formula: 'x[n] = \\delta[n]',
    zFormula: 'X(z) = 1',
    roc: 'Entire Z-plane',
  },
  [SignalType.STEP]: {
    id: SignalType.STEP,
    name: 'Unit Step (u[n])',
    description: 'Represents a signal turning on at n=0.',
    formula: 'x[n] = u[n]',
    zFormula: 'X(z) = \\frac{1}{1 - z^{-1}} = \\frac{z}{z-1}',
    roc: '|z| > 1',
  },
  [SignalType.RAMP]: {
    id: SignalType.RAMP,
    name: 'Unit Ramp (n·u[n])',
    description: 'Linear growth starting at n=0.',
    formula: 'x[n] = n \cdot u[n]',
    zFormula: 'X(z) = \\frac{z^{-1}}{(1 - z^{-1})^2} = \\frac{z}{(z-1)^2}',
    roc: '|z| > 1',
  },
  [SignalType.EXPONENTIAL]: {
    id: SignalType.EXPONENTIAL,
    name: 'Exponential (aⁿ·u[n])',
    description: 'Geometric sequence. Decays if |a| < 1, grows if |a| > 1.',
    formula: 'x[n] = a^n \cdot u[n]',
    zFormula: 'X(z) = \\frac{1}{1 - a z^{-1}} = \\frac{z}{z-a}',
    roc: '|z| > |a|',
  },
  [SignalType.DOUBLE_EXPONENTIAL]: {
    id: SignalType.DOUBLE_EXPONENTIAL,
    name: 'Double-Sided Exp (a^|n|)',
    description: 'Decays in both directions. Stable if |a| < 1.',
    formula: 'x[n] = a^{|n|}',
    zFormula: 'X(z) = \\frac{z(a^2 - 1)}{(z-a)(az-1)}',
    roc: '|a| < |z| < 1/|a|',
  },
  [SignalType.SINUSOIDAL]: {
    id: SignalType.SINUSOIDAL,
    name: 'Sinusoidal (sin(ω₀n)·u[n])',
    description: 'Oscillating signal starting at n=0.',
    formula: 'x[n] = \\sin(\\omega_0 n) \cdot u[n]',
    zFormula: 'X(z) = \\frac{z \sin(\\omega_0)}{z^2 - 2z \cos(\\omega_0) + 1}',
    roc: '|z| > 1',
  },
  [SignalType.POLE_ZERO]: {
    id: SignalType.POLE_ZERO,
    name: 'General 2nd Order (Pole-Zero Explorer)',
    description: 'Explore a generic system with conjugate poles and zeros.',
    formula: 'H(z) = K \\frac{(z-z_1)(z-z_1^*)}{(z-p_1)(z-p_1^*)}',
    zFormula: 'H(z)',
    roc: 'Depends on Pole Magnitude',
  }
};


// GEMINI SERVICE

let aiClient = null;

const initGemini = () => {
  // Safely check for API key in a browser environment
  const apiKey = (typeof window !== 'undefined' && window.process?.env?.API_KEY) || ''; 
  if (apiKey) {
    try {
        aiClient = new GoogleGenAI({ apiKey });
    } catch (e) {
        console.warn("Failed to initialize Gemini client", e);
    }
  }
};

const explainSignal = async (signalType, params) => {
  if (!aiClient) {
    initGemini();
    if (!aiClient) {
        return "AI features require an API Key. In this downloaded version, you would need to manually insert an API key into the source code to use the AI tutor.";
    }
  }

  const signal = SIGNALS[signalType];
  
  let paramDesc = "";
  if (signalType === SignalType.EXPONENTIAL || signalType === SignalType.DOUBLE_EXPONENTIAL) {
    paramDesc = `with parameter a = ${params.a}`;
  } else if (signalType === SignalType.SINUSOIDAL) {
    paramDesc = `with frequency omega = ${params.omega.toFixed(2)} rad/sample`;
  } else if (signalType === SignalType.POLE_ZERO) {
    paramDesc = `with pole radius ${params.poleMag.toFixed(2)} and phase ${(params.polePhase/Math.PI).toFixed(2)}pi`;
  }

  const prompt = `
    You are a Digital Signal Processing (DSP) expert tutor.
    Explain the discrete-time signal: ${signal.name} ${paramDesc}.
    
    Structure your response nicely in Markdown:
    1. Brief physical interpretation of the time-domain behavior.
    2. Explanation of the Z-Transform poles and zeros for this specific configuration.
    3. Discuss the Region of Convergence (ROC) and stability (e.g., is the unit circle included?).
    4. Keep it concise (under 200 words).
  `;

  try {
    const response = await aiClient.models.generateContent({
      model: 'gemini-2.5-flash',
      contents: prompt,
    });
    return response.text || "No explanation available.";
  } catch (error) {
    console.error("Gemini Error", error);
    return "Failed to fetch explanation from Gemini. " + (error.message || "Unknown error");
  }
};


// COMPONENTS

const MathRenderer = ({ formula }) => {
  const containerRef = useRef(null);
  const [isKatexLoaded, setIsKatexLoaded] = useState(false);

  useEffect(() => {
    if (window.katex) {
      setIsKatexLoaded(true);
      return;
    }

    const intervalId = setInterval(() => {
      if (window.katex) {
        setIsKatexLoaded(true);
        clearInterval(intervalId);
      }
    }, 100);

    return () => clearInterval(intervalId);
  }, []);

  useEffect(() => {
    if (containerRef.current && isKatexLoaded && window.katex) {
        try {
            containerRef.current.innerHTML = '';
            window.katex.render(formula, containerRef.current, {
                throwOnError: false,
                displayMode: true 
            });
        } catch (e) {
            console.error("KaTeX render error:", e);
            containerRef.current.innerText = formula;
        }
    }
  }, [formula, isKatexLoaded]);

  return (
    <div ref={containerRef} className="overflow-x-auto overflow-y-hidden min-h-[40px] flex items-center justify-center">
      {!isKatexLoaded && <span className="text-slate-400 text-sm animate-pulse">Loading formula...</span>}
    </div>
  );
};


const TimeDomainPlot = ({ signalType, params }) => {
  const data = useMemo(() => {
    const points = [];
    const nStart = -15; 
    const nEnd = 25;

    const yArr = {};
    
    // Coefficients for General 2nd Order
    const r_p = params.poleMag;
    const phi_p = params.polePhase;
    const r_z = params.zeroMag;
    const phi_z = params.zeroPhase;
    
    const a1 = -2 * r_p * Math.cos(phi_p);
    const a2 = r_p * r_p;
    const b0 = params.amplitude;
    const b1 = -2 * r_z * Math.cos(phi_z) * params.amplitude;
    const b2 = r_z * r_z * params.amplitude;

    const getX = (n) => (n === 0 ? 1 : 0);
    const getY = (n) => (yArr[n] !== undefined ? yArr[n] : 0);

    for (let n = nStart; n <= nEnd; n++) {
      let val = 0;
      const u = n >= 0 ? 1 : 0; 

      switch (signalType) {
        case SignalType.IMPULSE:
          val = n === 0 ? 1 : 0;
          val *= params.amplitude;
          break;
        case SignalType.STEP:
          val = u;
          val *= params.amplitude;
          break;
        case SignalType.RAMP:
          val = n * u;
          val *= params.amplitude;
          break;
        case SignalType.EXPONENTIAL:
          val = Math.pow(params.a, n) * u;
          val *= params.amplitude;
          break;
        case SignalType.DOUBLE_EXPONENTIAL:
          val = Math.pow(params.a, Math.abs(n));
          val *= params.amplitude;
          break;
        case SignalType.SINUSOIDAL:
          val = Math.sin(params.omega * n) * u;
          val *= params.amplitude;
          break;
        case SignalType.POLE_ZERO:
          if (n < 0) {
            val = 0;
          } else {
             val = b0 * getX(n) + b1 * getX(n-1) + b2 * getX(n-2)
                   - a1 * getY(n-1) - a2 * getY(n-2);
          }
          yArr[n] = val;
          break;
      }
      
      if (Math.abs(val) > 100) val = val > 0 ? 100 : -100;
      points.push({ n, val });
    }
    return points;
  }, [signalType, params]);

  return (
    <div className="w-full h-80 bg-white rounded-lg shadow-sm border border-slate-200 p-4">
      <h3 className="text-sm font-semibold text-slate-500 mb-2 uppercase tracking-wide">Time Domain <span className="normal-case font-normal text-slate-400 ml-2">{signalType === SignalType.POLE_ZERO ? 'Impulse Response h[n]' : 'x[n] vs n'}</span></h3>
      <ResponsiveContainer width="100%" height="100%">
        <ComposedChart data={data} margin={{ top: 20, right: 20, bottom: 20, left: 0 }}>
          <CartesianGrid stroke="#e2e8f0" strokeDasharray="3 3" vertical={false} />
          <XAxis 
            dataKey="n" 
            type="number" 
            domain={['dataMin', 'dataMax']} 
            tickCount={15}
            label={{ value: 'n', position: 'insideBottomRight', offset: -5 }} 
            stroke="#64748b"
            tick={{fontSize: 12}}
          />
          <YAxis 
            label={{ value: 'x[n]', angle: -90, position: 'insideLeft' }} 
            stroke="#64748b"
            tick={{fontSize: 12}}
          />
          <Tooltip 
            cursor={{ strokeDasharray: '3 3' }}
            contentStyle={{ backgroundColor: '#fff', borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
          />
          <Bar dataKey="val" barSize={2} fill="#cbd5e1" isAnimationActive={false}>
             {data.map((entry, index) => (
                <Cell key={`cell-${index}`} fill={entry.val >= 0 ? "#3b82f6" : "#ef4444"} />
              ))}
          </Bar>
          <Scatter dataKey="val" fill="#2563eb" r={4} isAnimationActive={false} />
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
};


const ZPlanePlot = ({ signalType, params }) => {
  const svgRef = useRef(null);

  useEffect(() => {
    if (!svgRef.current) return;

    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove(); 

    const width = svgRef.current.clientWidth;
    const height = svgRef.current.clientHeight;
    const margin = { top: 20, right: 20, bottom: 20, left: 20 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const g = svg.append("g")
      .attr("transform", `translate(${width / 2},${height / 2})`);

    const maxRange = 2.5; 
    const scale = d3.scaleLinear()
      .domain([-maxRange, maxRange])
      .range([-Math.min(innerWidth, innerHeight) / 2, Math.min(innerWidth, innerHeight) / 2]);

    const unitRadius = scale(1) - scale(0);
    
    let poles = [];
    let zeros = [];
    let rocRadiusInner = 0;
    let rocRadiusOuter = Infinity;
    let rocType = 'outside';

    switch (signalType) {
      case SignalType.IMPULSE:
        rocType = 'all'; 
        break;
      case SignalType.STEP:
        poles = [{ re: 1, im: 0 }];
        zeros = [{ re: 0, im: 0 }];
        rocRadiusInner = 1;
        rocType = 'outside';
        break;
      case SignalType.RAMP:
        poles = [{ re: 1, im: 0 }, { re: 1.05, im: 0.05 }];
        zeros = [{ re: 0, im: 0 }];
        rocRadiusInner = 1;
        rocType = 'outside';
        break;
      case SignalType.EXPONENTIAL:
        poles = [{ re: params.a, im: 0 }];
        zeros = [{ re: 0, im: 0 }];
        rocRadiusInner = Math.abs(params.a);
        rocType = 'outside';
        break;
      case SignalType.DOUBLE_EXPONENTIAL:
        poles = [{ re: params.a, im: 0 }, { re: 1/params.a, im: 0 }];
        zeros = [{ re: 0, im: 0 }];
        if (Math.abs(params.a) < 1) {
            rocRadiusInner = Math.abs(params.a);
            rocRadiusOuter = Math.abs(1/params.a);
            rocType = 'annulus';
        } else {
            rocType = 'none';
        }
        break;
      case SignalType.SINUSOIDAL:
        poles = [
          { re: Math.cos(params.omega), im: Math.sin(params.omega) },
          { re: Math.cos(params.omega), im: -Math.sin(params.omega) }
        ];
        zeros = [{ re: 0, im: 0 }, {re: 0, im: 0}]; 
        rocRadiusInner = 1;
        rocType = 'outside';
        break;
      case SignalType.POLE_ZERO:
        poles = [
            { re: params.poleMag * Math.cos(params.polePhase), im: params.poleMag * Math.sin(params.polePhase) },
            { re: params.poleMag * Math.cos(-params.polePhase), im: params.poleMag * Math.sin(-params.polePhase) }
        ];
        if (Math.abs(params.polePhase) < 0.01 || Math.abs(params.polePhase - Math.PI) < 0.01) {
            poles.pop();
        }

        if (params.zeroMag > 0.01) {
             zeros = [
                { re: params.zeroMag * Math.cos(params.zeroPhase), im: params.zeroMag * Math.sin(params.zeroPhase) },
                { re: params.zeroMag * Math.cos(-params.zeroPhase), im: params.zeroMag * Math.sin(-params.zeroPhase) }
            ];
             if (Math.abs(params.zeroPhase) < 0.01 || Math.abs(params.zeroPhase - Math.PI) < 0.01) {
                zeros.pop();
            }
        } else {
            zeros = [{ re: 0, im: 0 }, { re: 0, im: 0 }];
        }

        rocRadiusInner = params.poleMag;
        rocType = params.poleMag < 1 ? 'outside' : (params.poleMag === 1 ? 'none' : 'outside'); 
        break;
    }

    const maxDrawRadius = Math.max(innerWidth, innerHeight);

    if (rocType === 'outside') {
        const r = Math.min(scale(rocRadiusInner) - scale(0), maxDrawRadius);
        const arc = d3.arc()
            .innerRadius(r)
            .outerRadius(maxDrawRadius)
            .startAngle(0)
            .endAngle(2 * Math.PI);
        g.append("path").attr("d", arc).attr("fill", "#dbeafe").attr("opacity", 0.5);

    } else if (rocType === 'annulus') {
        const rIn = scale(rocRadiusInner) - scale(0);
        const rOut = Math.min(scale(rocRadiusOuter) - scale(0), maxDrawRadius);
        
        if (rOut > rIn) {
            const arc = d3.arc()
                .innerRadius(rIn)
                .outerRadius(rOut)
                .startAngle(0)
                .endAngle(2 * Math.PI);
            g.append("path").attr("d", arc).attr("fill", "#dbeafe").attr("opacity", 0.5);
        }
    } else if (rocType === 'all') {
        g.append("rect")
            .attr("x", -innerWidth/2).attr("y", -innerHeight/2)
            .attr("width", innerWidth).attr("height", innerHeight)
            .attr("fill", "#dbeafe").attr("opacity", 0.3);
    }

    g.append("circle")
        .attr("r", unitRadius)
        .attr("fill", "none")
        .attr("stroke", "#94a3b8")
        .attr("stroke-dasharray", "4 2");

    g.append("line").attr("x1", scale(-maxRange)).attr("y1", 0).attr("x2", scale(maxRange)).attr("y2", 0).attr("stroke", "#cbd5e1");
    g.append("line").attr("x1", 0).attr("y1", scale(-maxRange)).attr("x2", 0).attr("y2", scale(maxRange)).attr("stroke", "#cbd5e1");

    g.append("text").attr("x", scale(maxRange) - 10).attr("y", -5).text("Re").attr("font-size", "10px").attr("fill", "#64748b");
    g.append("text").attr("x", 5).attr("y", scale(maxRange) + 10).text("Im").attr("font-size", "10px").attr("fill", "#64748b");

    poles.forEach(p => {
        if (Math.abs(p.re) < maxRange && Math.abs(p.im) < maxRange) {
            const x = scale(p.re);
            const y = scale(-p.im);
            const size = 6;
            g.append("line").attr("x1", x-size).attr("y1", y-size).attr("x2", x+size).attr("y2", y+size).attr("stroke", "#dc2626").attr("stroke-width", 2);
            g.append("line").attr("x1", x+size).attr("y1", y-size).attr("x2", x-size).attr("y2", y+size).attr("stroke", "#dc2626").attr("stroke-width", 2);
        }
    });

    zeros.forEach(z => {
         if (Math.abs(z.re) < maxRange && Math.abs(z.im) < maxRange) {
            g.append("circle")
                .attr("cx", scale(z.re))
                .attr("cy", scale(-z.im))
                .attr("r", 5)
                .attr("fill", "none")
                .attr("stroke", "#2563eb")
                .attr("stroke-width", 2);
         }
    });
    
    if (rocType === 'none') {
        g.append("text")
         .attr("x", 0)
         .attr("y", 0)
         .attr("text-anchor", "middle")
         .attr("fill", "#ef4444")
         .attr("font-size", "14px")
         .text("Unstable");
    }

  }, [signalType, params]);

  return (
    <div className="w-full h-80 bg-white rounded-lg shadow-sm border border-slate-200 p-4 relative overflow-hidden">
      <h3 className="text-sm font-semibold text-slate-500 mb-2 uppercase tracking-wide absolute top-4 left-4 z-10">Z-Plane <span className="normal-case font-normal text-slate-400 ml-2">ROC & Pole-Zero</span></h3>
      <svg ref={svgRef} className="w-full h-full" />
      <div className="absolute bottom-4 right-4 flex flex-col space-y-1 bg-white/90 p-2 rounded text-xs border border-slate-100">
        <div className="flex items-center"><span className="w-3 h-3 border-2 border-blue-600 rounded-full mr-2"></span> Zero</div>
        <div className="flex items-center"><span className="w-3 h-3 relative mr-2 text-red-600 font-bold flex justify-center items-center">✕</span> Pole</div>
        <div className="flex items-center"><span className="w-3 h-3 bg-blue-100 mr-2 border border-blue-200"></span> ROC</div>
      </div>
    </div>
  );
};


const Controls = ({ signalType, params, onChange }) => {
  const handleChange = (key, value) => {
    onChange({ ...params, [key]: value });
  };

  const isGeneral = signalType === SignalType.POLE_ZERO;

  return (
    <div className="p-4 bg-slate-50 rounded-lg border border-slate-200 space-y-4">
      <h3 className="text-sm font-semibold text-slate-700 uppercase tracking-wide">Parameters</h3>
      
      <div>
        <div className="flex justify-between text-xs text-slate-500 mb-1">
          <span>Amplitude (Gain)</span>
          <span className="font-mono text-indigo-600">{params.amplitude.toFixed(1)}</span>
        </div>
        <input 
          type="range" 
          min="0.1" 
          max="5" 
          step="0.1" 
          value={params.amplitude}
          onChange={(e) => handleChange('amplitude', parseFloat(e.target.value))}
          className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
        />
      </div>

      {isGeneral && (
        <>
          <div className="pt-2 border-t border-slate-200">
            <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Poles (Conjugate Pair)</h4>
            
            <div className="mb-3">
                <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>Magnitude (r)</span>
                <span className="font-mono text-indigo-600">{params.poleMag.toFixed(2)}</span>
                </div>
                <input 
                type="range" 
                min="0.05" 
                max="1.5" 
                step="0.05" 
                value={params.poleMag}
                onChange={(e) => handleChange('poleMag', parseFloat(e.target.value))}
                className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-500"
                />
            </div>

            <div>
                <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>Phase (φ)</span>
                <span className="font-mono text-indigo-600">{(params.polePhase / Math.PI).toFixed(2)}π</span>
                </div>
                <input 
                type="range" 
                min="0" 
                max="3.14" 
                step="0.05" 
                value={params.polePhase}
                onChange={(e) => handleChange('polePhase', parseFloat(e.target.value))}
                className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-500"
                />
            </div>
          </div>

          <div className="pt-2 border-t border-slate-200">
            <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Zeros (Conjugate Pair)</h4>
            
            <div className="mb-3">
                <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>Magnitude (r)</span>
                <span className="font-mono text-indigo-600">{params.zeroMag.toFixed(2)}</span>
                </div>
                <input 
                type="range" 
                min="0" 
                max="1.5" 
                step="0.05" 
                value={params.zeroMag}
                onChange={(e) => handleChange('zeroMag', parseFloat(e.target.value))}
                className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500"
                />
            </div>

            <div>
                <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>Phase (φ)</span>
                <span className="font-mono text-indigo-600">{(params.zeroPhase / Math.PI).toFixed(2)}π</span>
                </div>
                <input 
                type="range" 
                min="0" 
                max="3.14" 
                step="0.05" 
                value={params.zeroPhase}
                onChange={(e) => handleChange('zeroPhase', parseFloat(e.target.value))}
                className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500"
                />
            </div>
          </div>
        </>
      )}

      {!isGeneral && (signalType === SignalType.EXPONENTIAL || signalType === SignalType.DOUBLE_EXPONENTIAL) && (
        <div>
          <div className="flex justify-between text-xs text-slate-500 mb-1">
            <span>Decay/Growth (a)</span>
            <span>{params.a.toFixed(2)}</span>
          </div>
          <input 
            type="range" 
            min="-1.5" 
            max="1.5" 
            step="0.05" 
            value={params.a}
            onChange={(e) => handleChange('a', parseFloat(e.target.value))}
            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
          />
          <p className="text-[10px] text-slate-400 mt-1">
            {signalType === SignalType.DOUBLE_EXPONENTIAL 
              ? (Math.abs(params.a) < 1 ? "Stable (Annular ROC)" : "No ROC (Diverges)")
              : (Math.abs(params.a) < 1 ? "Stable (|a| < 1)" : Math.abs(params.a) > 1 ? "Unstable (|a| > 1)" : "Marginally Stable")
            }
          </p>
        </div>
      )}

      {!isGeneral && signalType === SignalType.SINUSOIDAL && (
        <div>
          <div className="flex justify-between text-xs text-slate-500 mb-1">
            <span>Frequency (ω₀)</span>
            <span>{params.omega.toFixed(2)} rad</span>
          </div>
          <input 
            type="range" 
            min="0.1" 
            max="3.14" 
            step="0.05" 
            value={params.omega}
            onChange={(e) => handleChange('omega', parseFloat(e.target.value))}
            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
          />
        </div>
      )}

      {!isGeneral && (signalType === SignalType.IMPULSE || signalType === SignalType.STEP || signalType === SignalType.RAMP) && (
        <div className="text-xs text-slate-400 italic">
          Standard signals have fixed shape parameters. Change Amplitude to scale.
        </div>
      )}
    </div>
  );
};


// DYNAMIC FORMULAS

const getDynamicFormulas = (type, params) => {
  const A = params.amplitude; 
  const a = params.a;
  const w = params.omega;

  const fmt = (n) => {
      if (Math.abs(n) < 0.001) return "0";
      return Number.isInteger(n) ? n.toString() : n.toFixed(2).replace(/\.00$/, '');
  };
  
  // Helper for term multiplication A * term
  const mult = (val, term) => {
      if (Math.abs(val) < 0.001) return '0';
      if (Math.abs(val - 1) < 0.001) return term;
      if (Math.abs(val + 1) < 0.001) return '-' + term;
      return `${fmt(val)} \\cdot ${term}`;
  };

  let time = '';
  let z = '';

  switch (type) {
    case SignalType.IMPULSE:
      time = `x[n] = ${mult(A, '\\delta[n]')}`;
      z = `X(z) = ${fmt(A)}`;
      break;
    case SignalType.STEP:
      time = `x[n] = ${mult(A, 'u[n]')}`;
      z = `X(z) = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}\\frac{z}{z-1}`;
      break;
    case SignalType.RAMP:
      time = `x[n] = ${mult(A, 'n u[n]')}`;
      z = `X(z) = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}\\frac{z}{(z-1)^2}`;
      break;
    case SignalType.EXPONENTIAL:
      {
        const aStr = a < 0 ? `(${fmt(a)})` : fmt(a);
        time = `x[n] = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}${aStr}^n u[n]`;
        
        const denom = a < 0 ? `z - (${fmt(a)})` : `z - ${fmt(a)}`;
        z = `X(z) = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}\\frac{z}{${denom}}`;
      }
      break;
    case SignalType.DOUBLE_EXPONENTIAL:
      {
        const aStr = a < 0 ? `(${fmt(a)})` : fmt(a);
        time = `x[n] = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}${aStr}^{|n|}`;
        
        // Form: z(a^2 - 1) / ((z-a)(az-1))
        const numTerm = Math.pow(a, 2) - 1;
        const numStr = Math.abs(numTerm - 1) < 0.001 ? 'z' : (Math.abs(numTerm + 1) < 0.001 ? '-z' : `${fmt(numTerm)} z`);
        
        const p1 = a < 0 ? `z - (${fmt(a)})` : `z - ${fmt(a)}`;
        // az - 1
        const p2 = a === 1 ? 'z - 1' : (a === -1 ? '-z - 1' : `${fmt(a)}z - 1`);

        z = `X(z) = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}\\frac{${numStr}}{(${p1})(${p2})}`;
      }
      break;
    case SignalType.SINUSOIDAL:
      {
        time = `x[n] = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}\\sin(${fmt(w)} n) u[n]`;
        
        const sinW = Math.sin(w);
        const cosW = Math.cos(w);
        
        const numStr = Math.abs(sinW - 1) < 0.001 ? 'z' : (Math.abs(sinW + 1) < 0.001 ? '-z' : `${fmt(sinW)} z`);
        
        const midVal = 2 * cosW;
        let midStr = '';
        if (Math.abs(midVal) > 0.001) {
             midStr = midVal > 0 ? `- ${fmt(midVal)}z` : `+ ${fmt(Math.abs(midVal))}z`;
        }

        z = `X(z) = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}\\frac{${numStr}}{z^2 ${midStr} + 1}`;
      }
      break;
    case SignalType.POLE_ZERO:
      {
        time = `h[n] \\text{ (impulse response)}`;
        
        const r_p = params.poleMag;
        const phi_p = params.polePhase;
        const r_z = params.zeroMag;
        const phi_z = params.zeroPhase;
        
        const coeffDen1 = -2 * r_p * Math.cos(phi_p);
        const coeffDen2 = r_p * r_p;
        const coeffNum1 = -2 * r_z * Math.cos(phi_z);
        const coeffNum2 = r_z * r_z;

        const term1 = Math.abs(coeffDen1) < 0.01 ? '' : (coeffDen1 > 0 ? `+ ${fmt(coeffDen1)}z^{-1}` : `${fmt(coeffDen1)}z^{-1}`);
        const term2 = Math.abs(coeffDen2) < 0.01 ? '' : `+ ${fmt(coeffDen2)}z^{-2}`;

        const numTerm1 = Math.abs(coeffNum1) < 0.01 ? '' : (coeffNum1 > 0 ? `+ ${fmt(coeffNum1)}z^{-1}` : `${fmt(coeffNum1)}z^{-1}`);
        const numTerm2 = Math.abs(coeffNum2) < 0.01 ? '' : `+ ${fmt(coeffNum2)}z^{-2}`;
        
        z = `H(z) = ${Math.abs(A - 1) > 0.001 ? fmt(A) + ' \\cdot ' : ''}\\frac{1 ${numTerm1} ${numTerm2}}{1 ${term1} ${term2}}`;
      }
      break;
  }
  return { timeFormula: time, zFormula: z };
};


// APP

const App = () => {
  const [activeSignal, setActiveSignal] = useState(SignalType.EXPONENTIAL);
  const [params, setParams] = useState({
    a: 0.8,
    omega: 0.5,
    amplitude: 1.0,
    poleMag: 0.8,
    polePhase: 0.5,
    zeroMag: 0.0,
    zeroPhase: 0.0
  });
  
  const [aiExplanation, setAiExplanation] = useState("");
  const [isLoading, setIsLoading] = useState(false);

  const handleAskAI = useCallback(async () => {
    setIsLoading(true);
    setAiExplanation("");
    const text = await explainSignal(activeSignal, params);
    setAiExplanation(text);
    setIsLoading(false);
  }, [activeSignal, params]);

  const currentSignalDef = SIGNALS[activeSignal];

  const { timeFormula, zFormula } = useMemo(() => getDynamicFormulas(activeSignal, params), [activeSignal, params]);

  return (
    <div className="min-h-screen bg-slate-50 pb-12">
      <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold font-serif italic">Z</div>
            <h1 className="text-xl font-bold text-slate-900 tracking-tight">Signal Learner</h1>
          </div>
          <div className="text-sm text-slate-500 hidden sm:block">Offline Mode</div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div className="mb-8 overflow-x-auto pb-2">
          <div className="flex space-x-2 min-w-max">
            {Object.values(SIGNALS).map((sig) => (
              <button
                key={sig.id}
                onClick={() => {
                  setActiveSignal(sig.id);
                  setAiExplanation(""); 
                }}
                className={`px-4 py-2 rounded-full text-sm font-medium transition-colors border ${
                  activeSignal === sig.id
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-md'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'
                }`}
              >
                {sig.name}
              </button>
            ))}
          </div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
          
          <div className="lg:col-span-8 space-y-6">
            
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h2 className="text-2xl font-bold text-slate-900 mb-2">{currentSignalDef.name}</h2>
              <p className="text-slate-600 mb-6">{currentSignalDef.description}</p>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="p-4 bg-slate-50 rounded-lg border border-slate-100 flex flex-col justify-center">
                  <div className="text-xs text-slate-400 uppercase font-semibold mb-2">Time Domain</div>
                  <div className="text-slate-800">
                     <MathRenderer formula={timeFormula} />
                  </div>
                </div>
                <div className="p-4 bg-slate-50 rounded-lg border border-slate-100 flex flex-col justify-center">
                  <div className="text-xs text-slate-400 uppercase font-semibold mb-2">Z-Domain</div>
                  <div className="text-slate-800">
                    <MathRenderer formula={zFormula} />
                  </div>
                </div>
              </div>
              
              <div className="mt-4 flex items-center text-sm text-indigo-700 bg-indigo-50 px-4 py-2 rounded-md">
                <span className="font-semibold mr-2">ROC:</span> 
                <span className="font-serif italic">{currentSignalDef.roc}</span>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <TimeDomainPlot signalType={activeSignal} params={params} />
              <ZPlanePlot signalType={activeSignal} params={params} />
            </div>

            <div className="bg-gradient-to-r from-slate-900 to-slate-800 rounded-xl shadow-lg p-6 text-white overflow-hidden relative">
               <div className="absolute top-0 right-0 p-4 opacity-10">
                 <svg width="100" height="100" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-4h2v2h-2zm0-2h2V7h-2z"/></svg>
               </div>
               
               <div className="relative z-10">
                 <div className="flex items-center justify-between mb-4">
                   <h3 className="text-lg font-semibold flex items-center gap-2">
                     ✨ AI Tutor
                   </h3>
                   <button 
                     onClick={handleAskAI}
                     disabled={isLoading}
                     className="px-4 py-1.5 bg-indigo-500 hover:bg-indigo-400 disabled:bg-slate-600 rounded text-sm font-medium transition-colors shadow-sm"
                   >
                     {isLoading ? 'Thinking...' : 'Explain Current Plot'}
                   </button>
                 </div>
                 
                 {aiExplanation ? (
                   <div className="prose prose-invert prose-sm max-w-none text-slate-300">
                     <div className="whitespace-pre-wrap font-light">{aiExplanation}</div>
                   </div>
                 ) : (
                   <p className="text-slate-400 text-sm italic">
                     AI Features require API key. In this offline view, they might not work unless configured.
                   </p>
                 )}
               </div>
            </div>

          </div>

          <div className="lg:col-span-4">
            <div className="sticky top-24">
              <Controls signalType={activeSignal} params={params} onChange={setParams} />
              
              <div className="mt-6 p-4 bg-yellow-50 border border-yellow-100 rounded-lg">
                <h4 className="text-sm font-bold text-yellow-800 mb-2">Did you know?</h4>
                <p className="text-xs text-yellow-700 leading-relaxed">
                  The Region of Convergence (ROC) for a causal signal (right-sided) is always the exterior of a circle defined by the outermost pole. If the ROC includes the unit circle, the system is stable.
                </p>
              </div>
            </div>
          </div>
        
        </div>
      </main>
    </div>
  );
};


// RENDER

const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);

    </script>
  </body>
